name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-4.9/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          unzip -q SoulLand-github.zip -d proj
          cd proj
          gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoulLand-jar
          path: proj/build/libs/*.jar
